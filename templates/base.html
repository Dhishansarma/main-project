<body>

        <div class="logo">

        <nav>

    <header>
      <div class="logo">
        <a href="{% url 'home' %}"><img src="{% static 'Images\ABLOGOREG .png' %}" alt="ABTECHVILLE"></a>
      </div>
      <div class="menu-toggle" onclick="document.querySelector('nav ul').classList.toggle('show')">
        ☰
      </div>
      <nav>
        <ul>
          <li><a href="{% url 'home' %}">Home</a></li>
          <li><a href="{% url 'internship' %}">SummerInternship</a></li>
          <li><a href="{% url 'about' %}">About Us</a></li>
    
          <!-- Products Dropdown -->
          <li class="dropdown">
            <a id="productsBtn">Products</a>
            <div class="dropdown-menu" id="productsDropdown">
              <a href="{% url 'Webli' %}">WebDevelopment</a>
              <a href="{% url 'ardproli' %}">Arduino</a>
              <a href="{% url 'AWSli' %}">AWS</a>
            </div>
          </li>
          <li><a href="{% url 'team' %}">Team</a></li>
          <li><a href="{% url 'event' %}">Events</a></li>
        </ul>
      </nav>
    </header>
    
   



    
    
    {% block content %}

    {% endblock %}
   
    
    {% include 'footer.html' %}  <!-- Include Footer -->

    <script src="{% static 'js/script.js' %}"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Toggle dropdowns
        document.getElementById("productsBtn").addEventListener("click", function (e) {
          e.preventDefault();
          document.getElementById("productsDropdown").classList.toggle("show");
          document.getElementById("servicesDropdown").classList.remove("show"); // Close other dropdown
        });
    
        document.getElementById("servicesBtn").addEventListener("click", function (e) {
          e.preventDefault();
          document.getElementById("servicesDropdown").classList.toggle("show");
          document.getElementById("productsDropdown").classList.remove("show"); // Close other dropdown
        });
    
        // Close dropdowns if clicked outside
        document.addEventListener("click", function (e) {
          if (!e.target.closest(".dropdown")) {
            document.getElementById("productsDropdown").classList.remove("show");
            document.getElementById("servicesDropdown").classList.remove("show");
          }
        });
      });
    </script>
    
      
</body>
</html>
